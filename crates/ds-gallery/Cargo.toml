[package]
name = "ds-gallery"
description = "Gallery of every quire component across theme, accent, motion and material."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
chordkit = { workspace = true }
ds-core = { workspace = true }
ds = { workspace = true }
ds-shell = { workspace = true }
ds-lint = { workspace = true }
ds-settings = { workspace = true }
# `pdf`: so a workspace build compiles and tests `PdfFileThumb` (its tests need it).
ds-blitz = { workspace = true, features = ["pdf", "spell"] }
ds-harness = { workspace = true }
dioxus = { workspace = true }
image = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
dioxus-ssr = { workspace = true }

[features]
default = ["quire-desktop"]
# Desktop integration of the quire crates this one uses (design/36 section 1).
quire-desktop = ["ds-settings/quire-desktop", "ds-blitz/quire-desktop"]

[lints]
workspace = true
