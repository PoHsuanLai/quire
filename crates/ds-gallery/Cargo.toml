[package]
name = "ds-gallery"
description = "Gallery of every quire component across theme, accent, motion and material."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ds = { workspace = true, features = ["lint"] }
ds-settings = { workspace = true }
# `pdf-thumb`: so a workspace build compiles and tests `PdfFileThumb` (its tests need it).
ds-native = { workspace = true, features = ["pdf-thumb"] }
dioxus = { workspace = true }
image = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
dioxus-ssr = { workspace = true }

[lints]
workspace = true
