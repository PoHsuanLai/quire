[package]
name = "ds-style"
description = "The design system's appearance: tokens and the Token trait, materials, Space palettes, fonts, icons, the stylesheet's sections and the Kit seam."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ds-core = { workspace = true }
ds-core-derive = { workspace = true }
dioxus = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Decoding a status icon's PNG to decide symbolic or image (design/08-ICONS.md section 1.5).
image = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
dioxus-ssr = { workspace = true }
ds-core = { workspace = true, features = ["testing"] }
# Reading the shipped faces' cmaps in the key-glyph test.
skrifa = { workspace = true }

[dev-dependencies.ds-style]
workspace = true
features = ["dioxus"]

[features]
# The scope, scale, task and busy hooks and the `Glyph` component. Without it the crate is plain
# data (appearance, tokens, palettes, icons, CSS text), so a crate that only reads settings can
# name the appearance enums without linking Dioxus.
dioxus = ["dep:dioxus"]
