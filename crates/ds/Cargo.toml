[package]
name = "ds"
description = "Renderer-free design system: tokens, palette, icons, components, motion."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ds-core = { workspace = true }
ds-intents = { workspace = true }
ds-motion = { workspace = true, features = ["dioxus"] }
ds-style = { workspace = true, features = ["dioxus"] }
dioxus = { workspace = true }
# `ds::keys`: the toolkit side of the keymap; sources are injected, none is linked here.
chordkit = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
# `ui_manifest`: the conformance file an app's menu items and shortcuts are written to.
toml = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
dioxus-ssr = { workspace = true }
ds-lint = { workspace = true }
ds-core = { workspace = true, features = ["testing"] }
# `menus::export`: the tree's JSON form, round-tripped.
serde_json = { workspace = true }
