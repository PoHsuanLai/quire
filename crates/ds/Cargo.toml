[package]
name = "ds"
description = "Renderer-free design system: tokens, palette, icons, components, motion."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
dioxus = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
futures-timer = { workspace = true }
cssparser = { workspace = true, optional = true }

[lints]
workspace = true

[dev-dependencies]
dioxus-ssr = { workspace = true }

[features]
# The stylesheet linter; downstream crates enable it in their tests.
lint = ["dep:cssparser"]
# `@font-face` rules with the faces as base64 `data:` URIs (`fonts::font_face_css`), for a
# consumer still on the webview. Blitz consumers register `fonts::FACES` instead.
webview-fonts = []
