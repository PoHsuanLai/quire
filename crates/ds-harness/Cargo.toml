[package]
name = "ds-harness"
description = "Test driver for quire documents on Blitz: Harness, Clock::Virtual, snapshots, painters. Dev-only."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ds = { workspace = true }
ds-core = { workspace = true }
ds-blitz = { workspace = true }
# `AdapterPref`, the GPU ranking and device request the hybrid painter opens its device with.
blitz-kit = { workspace = true, features = ["adapter"] }
dioxus = { workspace = true }
blitz-dom = { workspace = true }
blitz-paint = { workspace = true }
blitz-traits = { workspace = true }
blitz-html = { workspace = true }
# The inline layouts' glyph runs: where each line of text is ink (`inset`).
parley = { workspace = true }
dioxus-native-dom = { workspace = true }
anyrender = { workspace = true }
anyrender_vello_hybrid = { workspace = true }
anyrender_vello_cpu = { workspace = true }
wgpu = { workspace = true }
# The hybrid backend (`gpu_paint`): vello_hybrid driven directly on an offscreen device, its image
# ids, and the device handle anyrender_vello_hybrid paints with.
vello_hybrid = { workspace = true }
vello_common = { workspace = true }
wgpu_context = { workspace = true }
rustc-hash = { workspace = true }
image = { workspace = true }
keyboard-types = { workspace = true }
peniko = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# The virtual-clock ask test wakes the document from a watch channel.
tokio = { workspace = true }
# `menu_export`: a client of the app's exported menu, on a private bus.
zbus = { workspace = true }
serde = { workspace = true }

[features]
# `pdf_app` and `Harness::pdf`: a harness's document printed as it is now.
pdf = ["ds-blitz/pdf"]
# `menu_export`: the exported menu bar, driven over a private bus.
menus = ["ds-blitz/menus"]

[lints]
workspace = true

[[test]]
name = "menu_export"
required-features = ["menus"]
