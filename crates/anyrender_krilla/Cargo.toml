[package]
name = "anyrender_krilla"
description = "An anyrender PaintScene that writes vector PDF pages through krilla: paths, gradients, images kept in their source encoding, and embedded, subsetted fonts with real text."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

# Blitz-agnostic on purpose: it names anyrender, peniko, krilla and skrifa only, so it can be
# offered upstream to anyrender as it is. What only Blitz knows (each run's source text, each
# image's source bytes) arrives as plain data in `Sources`.
[dependencies]
anyrender = { workspace = true }
peniko = { workspace = true }
krilla = { workspace = true }
skrifa = { workspace = true }

[lints]
workspace = true
