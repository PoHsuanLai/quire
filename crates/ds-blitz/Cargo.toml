[package]
name = "ds-blitz"
description = "Blitz glue for quire: launch, fonts, headless snapshots, PDF output and printing, test harness."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ds = { workspace = true }
# The shell's work areas as plain data (`Outputs`); its D-Bus reading is the opt-in `desktop-outputs`
# feature, so an app that never asks builds no D-Bus client.
ds-desktop = { workspace = true }
# Portable Blitz repairs shared with shell-host: `data:` decoding, the local file read, hover sync,
# fonts, pixel snap, adapter choice. `adapter`: `AdapterPref`, the GPU ranking.
blitz-kit = { workspace = true, features = ["adapter"] }
dioxus = { workspace = true }
blitz-dom = { workspace = true }
blitz-paint = { workspace = true }
blitz-traits = { workspace = true }
blitz-html = { workspace = true }
dioxus-native-dom = { workspace = true }
# `html`: an `<iframe srcdoc>` in the window parses into a real sub-document (G4). `clipboard`:
# copy and paste in every text field, and `ds_blitz::clipboard` (G5).
dioxus-native = { workspace = true, features = ["html", "clipboard"] }
# `open_window`: a second window on the same event loop, each with its own VirtualDom
# (`crate::windows`), and the two providers dioxus-native keeps private (`crate::native_providers`).
# `custom-widget`: the shell hands a texture layer's widget the renderer when it resumes and
# unregisters a removed layer's texture from the renderer (`crate::texture_layer`).
blitz-shell = { workspace = true, features = ["custom-widget"] }
dioxus-asset-resolver = { workspace = true }
webbrowser = { workspace = true }
# `text/html` from the system clipboard for an edit surface's paste.
arboard = { workspace = true }
anyrender = { workspace = true }
anyrender_vello_hybrid = { workspace = true }
# `DeviceHandle`, the renderer's device that a texture layer's widget hands the window's `Gpu`.
wgpu_context = { workspace = true }
parley = { workspace = true }
wgpu = { workspace = true }
image = { workspace = true }
keyboard-types = { workspace = true }
peniko = { workspace = true }
# PDF output (the `pdf` feature): the painter, which writes through pdfrum.
pdfrum-anyrender = { workspace = true, optional = true }
thiserror = { workspace = true }
# `menus`: the wire layout derives `Serialize`.
serde = { workspace = true, optional = true }
# The window's display and surface handles, for the activation token (Linux: `wayland_surface`).
raw-window-handle = { workspace = true }
tokio = { workspace = true }
# PDF thumbnails (part of the `pdf` feature): pdfrum's reader and CPU rasteriser.
pdfrum = { workspace = true, optional = true }
# Spellchecking (the `spell` feature): the checker, and XDG data for the user dictionary.
spellbook = { workspace = true, optional = true }
dirs = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# The print portal (the `print` feature): zbus with quire's async-io default (no executor is
# forced on the app), and a sealed memfd for the PDF's file descriptor.
zbus = { workspace = true, optional = true }
memfd = { workspace = true, optional = true }
# `WindowHandle::focus_with_token`: xdg-activation on the app's own Wayland connection, with the
# window's `wl_surface` borrowed (`wayland_surface`, the one `unsafe`).
wayland-client = { workspace = true, optional = true }
wayland-backend = { workspace = true, optional = true }
wayland-protocols = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# The fake compositor `xdg_activation`'s tests talk to.
wayland-server = { workspace = true }
wayland-protocols = { workspace = true, features = ["server"] }

[features]
default = ["quire-desktop"]
# Our desktop's integration on Linux (design/36 section 1): xdg-activation on the app's own Wayland
# connection (`WindowHandle::focus_with_token`). Without it a token is ignored and the window is
# raised through winit, the same call with the same result type. `print` and `menus` need it too.
quire-desktop = ["dep:wayland-client", "dep:wayland-backend", "dep:wayland-protocols"]
# `print_dialog`: the system print dialog (the desktop portal on Linux), else the viewer.
# Off by default, so an app that never prints builds no D-Bus client for it.
print = ["quire-desktop", "dep:zbus", "dep:memfd"]
# `ds_blitz::menus`: the app's menu bar served as `com.canonical.dbusmenu` on its own bus
# connection, so the shell's bar shows the focused app's menus (design/27 section 5.2). Off by
# default, so an app that exports no menu builds no D-Bus client for it.
menus = ["quire-desktop", "dep:zbus", "dep:serde"]
# `AppHandle::follow_desktop_outputs`: the shell's work area and scale from `org.quire.Outputs1`
# (ds-desktop's `Outputs`), fed to `AppHandle::screen_area`. Off by default, so an app that never asks
# builds no D-Bus client for it.
desktop-outputs = ["ds-desktop/dbus"]
# PDF output (`pdf`, `PageSpec`) and `PdfFileThumb`: a PDF's first page rasterised off the UI
# thread and cached, drawn by `ds::PdfThumb`. Off by default, so an app that writes and shows no
# PDF builds no PDF writer or reader.
pdf = ["dep:pdfrum-anyrender", "dep:pdfrum"]
# `ds_blitz::spell`: an `EditSurface`'s spellchecker (`ds::HostSpell`), system Hunspell
# dictionaries checked on one worker thread. Off by default, so an app that never checks
# spelling builds no checker.
spell = ["dep:spellbook", "dep:dirs"]

# `QUIRE_DEBUG_PROBE=<dir>`: each window writes its controls, by role and name, with their boxes,
# to a file there after every frame (`crate::probe`), so a scenario presses a control by name.
# Off by default and never in a release build: a scenario build turns it on with
# `--features ds-blitz/debug-probe`.
debug-probe = []
# `ds_blitz::seam`: the parts a headless host wires a document from. For `ds-harness` and tests
# only; an app has no use for them, so they are off by default and carry no stability promise.
testing = []

[lints]
workspace = true

[dev-dependencies]
# The driver every host test in this crate runs through.
ds-harness = { workspace = true, features = ["pdf"] }
# Reading printouts back: text, fonts, images, and a page rasterised for the visual check.
pdfrum = { workspace = true }
# Writing PDFs for the thumbnail tests (a filled page, an encrypted one).
pdfrum-edit = { workspace = true }
pdfrum-common = { workspace = true }
# Glyph ids from the cmap, for the colour-emoji and font-stack tests.
skrifa = { workspace = true }

[[example]]
name = "window"

[[example]]
name = "edit"

[[example]]
name = "second_window"

[[example]]
name = "file_drop"

[[example]]
name = "texture_layer"

[[example]]
name = "pdf"
required-features = ["pdf"]

[[example]]
name = "print"
required-features = ["print"]

[[test]]
name = "pdf_thumb"
required-features = ["pdf"]

[[test]]
name = "spell_worker"
required-features = ["spell"]

[[test]]
name = "spell_edit"
required-features = ["spell"]

[[test]]
name = "pdf_thumb_queue"
required-features = ["pdf"]
