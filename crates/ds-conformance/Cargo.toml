[package]
name = "ds-conformance"
description = "Behaviour tests for every quire component, driven through ds-harness on a real Blitz document. Test-only."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dev-dependencies]
chordkit = { workspace = true }
ds = { workspace = true }
ds-shell = { workspace = true }
ds-blitz = { workspace = true, features = ["testing"] }
ds-harness = { workspace = true }
ds-settings = { workspace = true, features = ["dioxus"] }
dioxus = { workspace = true }
image = { workspace = true }

[features]
default = ["quire-desktop"]
# Desktop integration of the quire crates this one uses (design/36 section 1).
quire-desktop = ["ds-settings/quire-desktop", "ds-blitz/quire-desktop"]

[lints]
workspace = true
