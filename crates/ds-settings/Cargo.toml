[package]
name = "ds-settings"
description = "Settings I/O: SettingsDoc and Store (lenient load, atomic save, directory watch), the appearance file, the settings portal."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ds-core = { workspace = true }
ds-style = { workspace = true }
ds-settings-derive = { workspace = true }
dioxus = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
notify = { workspace = true }
futures-timer = { workspace = true }
zbus = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
# The tests' runtime and the `Spawner` they hand the watches; the crate itself names no runtime.
tokio = { workspace = true }

[features]
# `use_environment`, the signal a surface resolves its look from.
dioxus = ["dep:dioxus", "ds-style/dioxus"]
# Drive zbus on the tokio runtime the shell already runs (see the workspace zbus note).
tokio = ["zbus/tokio"]
