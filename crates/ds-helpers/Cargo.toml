[package]
name = "ds-helpers"
description = "Missing helpers: apps declare the distro tools they run, probe for them, and ask PackageKit to install one at the moment of use."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ds-peer = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
zbus = { workspace = true, optional = true }

# `update_atomic` locks a sidecar file between programs.
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
# The tests' runtime; the crate itself names none (zbus brings its own executor).
tokio = { workspace = true }
# The tests run zbus on that runtime (the fake PackageKit sleeps with tokio inside a zbus
# handler). Named here so `cargo test -p ds-helpers` alone builds it so, not only when another
# workspace member happens to turn the feature on.
zbus = { workspace = true, features = ["tokio"] }

[features]
default = ["quire-desktop"]
# The PackageKit backend (`installer/packagekit.rs`), over the system bus. Without it
# `PackageKit::system()` still exists and every install is `Outcome::Unsupported`
# (design/36 section 2); `PackageKit::on` is absent, since it takes a zbus connection.
quire-desktop = ["dep:zbus"]

[[test]]
name = "packagekit"
required-features = ["quire-desktop"]
