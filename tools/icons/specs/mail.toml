# Mail: an envelope standing out of the plate, its flap a groove pressed into it.
# Coordinates are the 24-unit glyph grid over the plate (safe area 2.4..21.6). Colours come
# from the dialect's roles (design/08-ICONS.md 2.10); no strokes, form from the emboss.
name = "mail"
dialect = "monochrome"
tint = "slate"
grain = 20

[[layer]]
kind = "rect"
at = [4.5, 6.5]
size = [15, 11]
corners = [2.5, 2.5, 2.5, 1]
fill = "symbol"

[[layer]]
kind = "chevron"
tip = [12, 12.2]
reach = 5.2
heading = "down"
width = 1.4
fill = "detail"
relief = "recessed"
