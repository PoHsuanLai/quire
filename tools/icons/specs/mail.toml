# Mail: a paper envelope pressed up out of a blue-to-violet plate, its flap a groove pressed in.
# Coordinates are the 24-unit glyph grid laid over the plate; the safe area is 2.4..21.6.
# design/08-ICONS.md 2.8-2.9: filled shapes only, no strokes; form comes from the emboss.
name = "mail"
ground = { start = "blue", end = "violet" }
grain = 20

[[layer]]
kind = "rect"
at = [4.5, 6.5]
size = [15, 11]
corners = [2.5, 2.5, 2.5, 1]
fill = "paper"
opacity = 0.92
relief = "raised"

[[layer]]
kind = "chevron"
tip = [12, 12.2]
reach = 5.2
heading = "down"
width = 1.3
fill = "ink"
opacity = 0.10
relief = "recessed"
