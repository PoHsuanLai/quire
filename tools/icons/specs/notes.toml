# Notes: a paper sheet with its corner turned down, two lines pressed into it.
name = "notes"
ground = { start = "green", end = "blue" }
grain = 20

# The sheet, its bottom-right corner cut on the fold line (points inset by `round`).
[[layer]]
kind = "polygon"
points = [[6, 5], [18, 5], [18, 14.1], [13.1, 19], [6, 19]]
round = 1
fill = "paper"
opacity = 0.92
relief = "raised"

# The turned-down corner: the sheet's back, tinted by the plate, raised off the sheet.
[[layer]]
kind = "fold"
at = [13.2, 14.2]
size = 4.8
corner = "top-left"
fill = "start"
opacity = 0.45
relief = "raised"

[[layer]]
kind = "bar"
from = [9, 9.5]
to = [15, 9.5]
width = 1.4
fill = "ink"
opacity = 0.10
relief = "recessed"

[[layer]]
kind = "bar"
from = [9, 12.6]
to = [12.4, 12.6]
width = 1.4
fill = "ink"
opacity = 0.10
relief = "recessed"
