# Notes: a paper sheet with one lifted corner turned down, two ink lines of writing.
name = "notes"
family = "green"
grain = 30

# The sheet, its bottom-right corner cut on the fold line (points inset by `round`).
[[layer]]
kind = "polygon"
points = [[6, 5], [18, 5], [18, 14.1], [13.1, 19], [6, 19]]
round = 1
fill = "paper"
lift = "lifted"

# The turned-down corner: the sheet's back, in the plate's base tone.
[[layer]]
kind = "fold"
at = [13.2, 14.2]
size = 4.8
corner = "top-left"
fill = "base"
lift = "lifted"

[[layer]]
kind = "bar"
from = [9, 9.5]
to = [15, 9.5]
stroke = "ink"

[[layer]]
kind = "bar"
from = [9, 13]
to = [12, 13]
stroke = "ink"
