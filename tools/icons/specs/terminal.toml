# Terminal: a prompt chevron and a cursor block; the cursor is the spot.
name = "terminal"
dialect = "graphite"
tint = "sage"
grain = 20

[[layer]]
kind = "chevron"
tip = [10.5, 12]
reach = 4
heading = "right"
width = 2.4
fill = "symbol"

[[layer]]
kind = "rect"
at = [13.2, 13.8]
size = [5.2, 2.4]
corners = [1.2, 1.2, 1.2, 1.2]
fill = "spot"
