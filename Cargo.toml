[workspace]
resolver = "3"
members = [
  "crates/ds",
  "crates/ds-settings",
  "crates/ds-settings-derive",
  "crates/ds-native",
  "crates/anyrender_pdfrum",
  "crates/ds-gallery",
  "tools/icons",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
# The newest minimum of anything quire depends on: pdfrum's crates declare 1.92 (blitz at the
# pinned rev needs 1.91). The toolchain itself is pinned in rust-toolchain.toml (1.98.1).
rust-version = "1.92"
repository = "https://github.com/PoHsuanLai/quire"
publish = false

[workspace.dependencies]
ds                 = { path = "crates/ds" }
ds-settings        = { path = "crates/ds-settings" }
ds-settings-derive = { path = "crates/ds-settings-derive" }
ds-native          = { path = "crates/ds-native" }
anyrender_pdfrum   = { path = "crates/anyrender_pdfrum" }

# ---- BEGIN PINNED BLOCK (source of truth: quire/docs/workspace-deps.toml) ----
# Copied verbatim into [workspace.dependencies] of quire, shell-host and sill. Bumped only by a
# dedicated "toolchain bump" wave that runs every repo's gates. Versions of the render stack
# (anyrender, vello, wgpu, parley) are the ones blitz's own Cargo.lock resolves at this rev;
# taffy (git) and stylo come through the blitz crates and are never named directly.

# Blitz: git main, pinned by rev (crates.io dioxus-native 0.8 alpha does not build with
# blitz 0.3.0-beta.2). The in-tree dioxus-native-dom targets dioxus 0.7.x.
blitz-dom = { git = "https://github.com/DioxusLabs/blitz", rev = "e99fbdbd1d03b9f0aa1622c3f810d95daac92042", default-features = false, features = ["svg", "system-fonts", "custom-widget", "accessibility"] }
blitz-paint = { git = "https://github.com/DioxusLabs/blitz", rev = "e99fbdbd1d03b9f0aa1622c3f810d95daac92042", features = ["custom-widget"] }
blitz-traits = { git = "https://github.com/DioxusLabs/blitz", rev = "e99fbdbd1d03b9f0aa1622c3f810d95daac92042" }
# The HTML parser (html5ever 0.39): an `<iframe srcdoc>` builds a real sub-document. ds-native
# installs it in headless documents; the window gets it through dioxus-native's `html` feature.
blitz-html = { git = "https://github.com/DioxusLabs/blitz", rev = "e99fbdbd1d03b9f0aa1622c3f810d95daac92042" }
dioxus-native-dom = { git = "https://github.com/DioxusLabs/blitz", rev = "e99fbdbd1d03b9f0aa1622c3f810d95daac92042", default-features = false, features = ["svg", "system-fonts", "accessibility"] }
# The portable window path for apps (winit); the shell uses shell-host instead.
dioxus-native = { git = "https://github.com/DioxusLabs/blitz", rev = "e99fbdbd1d03b9f0aa1622c3f810d95daac92042", default-features = false, features = ["vello-hybrid", "svg", "system-fonts", "accessibility"] }
# The system clipboard's text/html, for an edit surface's paste (ds-native): blitz-shell's own
# arboard (its `clipboard` feature, same features), read directly since ShellProvider has text only.
arboard = { version = "3.6", default-features = false }

# Dioxus 0.7.x (renderer-free core; mailo is on 0.7.10).
dioxus = { version = "0.7", default-features = false, features = ["macro", "html", "hooks", "signals"] }
dioxus-document = "0.7"

# Render stack, matched to blitz's lockfile at the rev above.
anyrender = "0.13"
anyrender_vello_hybrid = "0.10"
anyrender_vello_cpu = { version = "0.17", features = ["multithreading"] }
vello_hybrid = "0.1"
wgpu = "29"
wgpu_context = "0.9"
# Per-device image cache for the shared hybrid renderer (SPIKE.md S1 finding 5).
rustc-hash = "2"
vello_common = "0.1"
parley = { version = "0.11.1", default-features = false, features = ["std"] }
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg"] }

# Wayland client (shell-host and sill share one sctk major: cosmic-client-toolkit uses 0.20).
smithay-client-toolkit = { version = "0.20", default-features = false, features = ["calloop", "xkbcommon"] }
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.32.13", features = ["client", "staging", "unstable"] }
calloop = "0.14"
calloop-wayland-source = "0.4"
xkbcommon = "0.8"
raw-window-handle = "0.6"
keyboard-types = "0.7"
cursor-icon = "1"

# Common.
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-timer = "3"
cssparser = "0.37"
notify = "8.2"
# zbus with its default async-io backend: a library must not pick the executor for its
# consumers (mailo's blocking keyring calls under a tokio runtime panicked when ds-settings
# forced zbus/tokio through feature unification). Shells that run zbus under tokio enable
# `ds-settings/tokio` instead.
zbus = { version = "5.19" }
dirs = "6"
toml = "1"
# SSR renders for component goldens and markup lint (dev-dependency in consumers).
dioxus-ssr = "0.7"
# Named directly for image paints in custom widgets (blitz re-exports nothing).
peniko = "0.6"
# PDF output (ds-native `pdf`, the `anyrender_pdfrum` painter): pdfrum, the user's own pure-Rust
# PDF library (github.com/PoHsuanLai/pdfrum, MIT OR Apache-2.0). pdfrum-edit writes the file
# (canvas, glyph-run fonts subset and instanced at the layout's instance, gradients, JPEG and
# PNG passthrough); `variable-fonts` lets its subsetter instance variable and CFF2 faces.
# Pinned to pdfrum main at 02a8dcb6 (glyph runs, gradients, blank documents, PNG passthrough,
# instanced subsets named after their instance).
# TODO: -> crates.io 0.4 once published.
pdfrum-edit = { git = "https://github.com/PoHsuanLai/pdfrum", rev = "02a8dcb6", features = ["variable-fonts"] }
pdfrum-object = { git = "https://github.com/PoHsuanLai/pdfrum", rev = "02a8dcb6" }
pdfrum-common = { git = "https://github.com/PoHsuanLai/pdfrum", rev = "02a8dcb6" }
# Font tables read directly by the painter (cmap reversed, metrics at an instance): the version
# parley already resolves at the blitz rev, so no second copy for this.
skrifa = "0.44"
# Reading PDFs back in tests (text, fonts, images, a rasterised page): dev-dependency only.
pdfrum = { git = "https://github.com/PoHsuanLai/pdfrum", rev = "02a8dcb6", default-features = false, features = ["vello-cpu"] }
# The print portal's fd, from a sealed anonymous file (ds-native's `print` feature, Linux only).
memfd = "0.6"
# Proc-macro crates for ds-settings-derive.
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"

# Shell-only (COSMIC).
cosmic-client-toolkit = { git = "https://github.com/pop-os/cosmic-protocols", rev = "c0cff4db14c37ed954983158e4055aa94c7741d9" }
upower_dbus = { git = "https://github.com/pop-os/dbus-settings-bindings", rev = "eed01dd3609e90e3c8cd043656734c500956c793" }
cosmic-dbus-networkmanager = { git = "https://github.com/pop-os/dbus-settings-bindings", rev = "eed01dd3609e90e3c8cd043656734c500956c793" }
logind-zbus = "5"
libpulse-binding = "2.30"
system-tray = "0.8.9"
freedesktop-desktop-entry = "0.8.3"
freedesktop-icons = "0.4"
nucleo-matcher = "0.3.1"
fend-core = "1.5.8"
clap = { version = "4", features = ["derive"] }
# latchkey lives in mailo until it is split into its own repo; cargo finds crates/latchkey itself.
latchkey = { git = "https://github.com/PoHsuanLai/mailo", rev = "e8344176ffcc0455c585dafd722c05c911ddc5c4" }
# ---- END PINNED BLOCK ----



[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
todo = "allow"

